version: "3.7"

services:
  db:
    image: postgres:12
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orders
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: orders
      JWT_SECRET: secret
      AWS_REGION: us-east-1
      PORT: 3000
    ports:
      - "3000:3000"
    command: sh -c "node src/db/migrate.js && node src/server.js"

volumes:
  pgdata:
